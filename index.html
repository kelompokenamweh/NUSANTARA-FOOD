<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara Food</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍽️ Nusantara Food</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#pesanan">Pesanan</a>
    </nav>
</header>

<section class="hero" id="home">
    <h2>Selamat Datang di Nusantara Food</h2>
    <p>Nikmati berbagai makanan khas Nusantara!</p>
    <a href="#menu" class="btn">Lihat Menu</a>
</section>

<section id="menu">
    <h2>Daftar Menu</h2>

    <div class="menu-container" id="daftar-menu">
    </div>
</section>

<section id="pesanan">
    <h2>Keranjang Pesanan 🛒</h2>

    <div id="keranjang"></div>

    <h3 id="total">Total: Rp0</h3>

    <input type="text" id="nama"
        placeholder="Masukkan nama pemesan">

    <input type="text" id="alamat"
        placeholder="Masukkan alamat">

    <button onclick="checkout()">
        Pesan Sekarang
    </button>

    <div id="hasil"></div>
</section>

<footer>
    <p>© 2026 Nusantara Food | Website Restoran</p>
</footer>

<script src="script.js"></script>
</body>
</html>
